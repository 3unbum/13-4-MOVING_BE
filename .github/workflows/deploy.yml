name: Deploy To EC2

# main에 머지되면 자동 배포합니다.
# dev는 개발 통합 브랜치라 배포하지 않습니다.
on:
  push:
    branches:
      - main

# 배포가 겹치면 pm2 재시작 중에 다음 배포가 끼어들 수 있어 직렬화합니다.
concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    name: EC2 배포
    runs-on: ubuntu-latest

    steps:
      - name: 레포지토리 체크아웃
        uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: 의존성 설치
        run: npm ci

      - name: Prisma Client 생성
        run: npx prisma generate

      # 배포 전 마지막 방어선입니다. 여기서 실패하면 EC2에 올라가지 않습니다.
      - name: 테스트
        run: npm test

      # 빌드는 러너에서 확인만 하고, 실제 산출물은 EC2에서 다시 만듭니다.
      # (EC2에 .git이 있어 git pull 방식을 유지 — Prisma가 schema.prisma를 필요로 합니다)
      - name: 빌드 확인
        run: npm run build

      - name: SSH로 EC2 접속해 배포
        uses: appleboy/ssh-action@v1.0.3
        env:
          ENV: ${{ secrets.ENV }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          envs: ENV
          # 한 줄이라도 실패하면 배포를 중단합니다
          script_stop: true
          script: |
            cd /home/ec2-user/moving-deploy
            git fetch origin main
            git reset --hard origin/main

            # ⚠️ .env를 **통째로 덮어씁니다.**
            # 환경변수를 추가·수정할 일이 생기면 EC2에서 직접 고치지 말고
            # 반드시 GitHub Secrets의 `ENV`를 고치세요. EC2에서 고쳐봐야 다음 배포에 날아갑니다.
            echo "$ENV" > .env

            npm ci

            # generated/ 는 gitignore 대상이라 배포할 때마다 다시 만들어야 합니다.
            # 빠뜨리면 서버가 import 에러로 안 뜹니다.
            npx prisma generate

            npm run build

            # 이미 떠 있으면 재시작, 없으면 새로 시작합니다.
            #
            # ⚠️ 현재 fork_mode라 reload도 실제로는 restart입니다(1~2초 끊김).
            # 무중단이 필요하면 cluster 모드로 바꿔야 하는데, 그건 별도 작업입니다.
            # 그래도 `pm2 kill`보다 낫습니다 — kill은 다른 프로세스까지 전부 죽입니다.
            #
            # 시작 명령은 현재 EC2에 떠 있는 것과 동일하게 맞췄습니다
            # (script path: /home/ec2-user/moving-deploy/dist/src/server.js).
            # 여기가 어긋나면 pm2가 초기화된 뒤 첫 배포에서 다른 방식으로 떠버립니다.
            pm2 reload moving-backend --update-env \
              || pm2 start dist/src/server.js --name moving-backend
            pm2 save
